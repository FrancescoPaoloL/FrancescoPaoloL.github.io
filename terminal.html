<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>fpl@web:~$</title>
<style>
  @font-face {
    font-family: "FreeMono";
    src: url("/assets/fonts/FreeMono.ttf") format("truetype");
    font-weight: normal;
  }
  @font-face {
    font-family: "FreeMono";
    src: url("/assets/fonts/FreeMonoBold.ttf") format("truetype");
    font-weight: bold;
  }
  :root { --bg:#0a0e0a; --fg:#33ff66; --dim:#1f8a3f; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "FreeMono", ui-monospace, monospace;
    font-size: 15px; line-height: 1.5;
  }
  #screen {
    height: 100vh; overflow-y: auto;
    padding: 18px 16px 60px;
    cursor: text;
    text-shadow: 0 0 2px rgba(51,255,102,.35);
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .dim { color: var(--dim); }
  a { color: var(--fg); }
  #inputline { display: flex; }
  .prompt { color: var(--fg); white-space: pre; }
  #cmd {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--fg); font: inherit; text-shadow: inherit; padding: 0;
    caret-color: var(--fg);
  }
  /* scanline / crt hint, discreto */
  #screen::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      transparent 0 2px, rgba(0,0,0,.12) 2px 3px);
  }
</style>
</head>
<body>
<div id="screen" onclick="document.getElementById('cmd').focus()">
  <div id="output"></div>
  <div id="inputline">
    <span class="prompt">fpl@web:~$&nbsp;</span>
    <input id="cmd" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
(function () {
  var output = document.getElementById("output");
  var cmd = document.getElementById("cmd");
  var screen = document.getElementById("screen");

  var projects = {
    "imgpoison":         "JPEG steganography (LSB + spread spectrum). github.com/FrancescoPaoloL/imgpoison",
    "lockfile-analyzer": "Static analysis for npm/yarn lockfiles: typosquat, integrity, lifecycle scripts.",
    "llm-tollgate-poc":  "In-process agent-side security gateway: policy, injection scan, taint propagation.",
    "pngprobe":          "PNG parser from scratch, extracts embedded ZIP + PyTorch tensors.",
    "swarm-variety-collapse": "N SmolLM2 nodes, self-regulating loop. Endogenous variety collapse as attack surface."
  };

  var banner =
"  __       _\n" +
" / _|_ __ | |\n" +
"| |_| '_ \\| |    Francesco Paolo L.\n" +
"|  _| |_) | |    backend engineer -> AI security\n" +
"|_| | .__/|_|\n" +
"    |_|\n" +
"\n" +
"type 'help' and press enter.";

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function print(text, cls) {
    var d = document.createElement("div");
    d.className = "line" + (cls ? " " + cls : "");
    d.innerHTML = text;
    output.appendChild(d);
  }

  function commands(input) {
    var parts = input.trim().split(/\s+/);
    var c = parts[0];
    var arg = parts.slice(1).join(" ");

    switch (c) {
      case "": return;
      case "help":
        print("commands:", "dim");
        print("  whoami            who am i");
        print("  ls projects       list projects");
        print("  cat &lt;project&gt;     show a project");
        print("  stack             my tools");
        print("  contact           where to find me");
        print("  clear             clear the screen");
        break;
      case "whoami":
        print("Senior backend engineer (.NET/Azure) moving toward AI security.");
        print("I build open-source tooling for LLM security. Debian + nvim + C.");
        break;
      case "ls":
        if (arg === "projects" || arg === "") {
          print(Object.keys(projects).join("   "));
        } else {
          print("ls: cannot access '" + esc(arg) + "': No such file or directory", "dim");
        }
        break;
      case "cat":
        if (!arg) { print("cat: missing operand. try 'ls projects'.", "dim"); break; }
        if (projects[arg]) { print(esc(projects[arg])); }
        else { print("cat: " + esc(arg) + ": No such file or directory", "dim"); }
        break;
      case "stack":
        print("debian · nvim · c · python · llama.cpp · azure");
        break;
      case "contact":
        print("blog   <a href='/'>francescopaolol.github.io</a>");
        print("code   <a href='https://github.com/FrancescoPaoloL' target='_blank' rel='noopener'>github.com/FrancescoPaoloL</a>");
        print("fedi   <a href='https://infosec.exchange/@FrancescoPaoloL' target='_blank' rel='noopener'>infosec.exchange/@FrancescoPaoloL</a>");
        break;
      case "clear":
        output.innerHTML = "";
        break;
      case "exit":
        print("there is no exit. (try the browser back button.)", "dim");
        break;
      default:
        print(esc(c) + ": command not found. type 'help'.", "dim");
    }
  }

  // --- command history (up/down) and tab-completion ---
  var history = [];        // past commands, oldest first
  var histIndex = 0;       // points one past the last entry when not browsing

  var COMMANDS = ["whoami", "ls", "cat", "stack", "contact", "help", "clear", "exit"];

  // return the list of completions for the current input, or null if none/ambiguous handled
  function complete(val) {
    var parts = val.split(/\s+/);
    // completing an argument to `cat`
    if (parts[0] === "cat" && parts.length === 2) {
      var frag = parts[1];
      var names = Object.keys(projects).filter(function (n) { return n.indexOf(frag) === 0; });
      return { base: "cat ", frag: frag, matches: names };
    }
    // completing the command itself (first word, no space yet)
    if (parts.length === 1) {
      var cmds = COMMANDS.filter(function (n) { return n.indexOf(parts[0]) === 0; });
      return { base: "", frag: parts[0], matches: cmds };
    }
    return { base: "", frag: "", matches: [] };
  }

  // longest common prefix of a list of strings
  function commonPrefix(arr) {
    if (!arr.length) return "";
    var p = arr[0];
    for (var i = 1; i < arr.length; i++) {
      while (arr[i].indexOf(p) !== 0) p = p.slice(0, -1);
    }
    return p;
  }

  cmd.addEventListener("keydown", function (e) {
    // Enter: run the command
    if (e.key === "Enter") {
      var val = cmd.value;
      print("<span class='prompt'>fpl@web:~$ </span>" + esc(val));
      if (val.trim() !== "") {
        history.push(val);
      }
      histIndex = history.length;
      commands(val);
      cmd.value = "";
      screen.scrollTop = screen.scrollHeight;
      return;
    }

    // Up: older command
    if (e.key === "ArrowUp") {
      e.preventDefault();
      if (histIndex > 0) {
        histIndex--;
        cmd.value = history[histIndex];
      }
      return;
    }

    // Down: newer command (or empty line past the end)
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (histIndex < history.length - 1) {
        histIndex++;
        cmd.value = history[histIndex];
      } else {
        histIndex = history.length;
        cmd.value = "";
      }
      return;
    }

    // Tab: complete
    if (e.key === "Tab") {
      e.preventDefault();
      var c = complete(cmd.value);
      if (!c.matches.length) return;
      if (c.matches.length === 1) {
        cmd.value = c.base + c.matches[0];
      } else {
        var pre = commonPrefix(c.matches);
        if (pre.length > c.frag.length) {
          cmd.value = c.base + pre;   // extend to common prefix
        } else {
          print("<span class='prompt'>fpl@web:~$ </span>" + esc(cmd.value));
          print(c.matches.join("   "), "dim");   // list options, bash-style
          screen.scrollTop = screen.scrollHeight;
        }
      }
      return;
    }
  });

  print(banner, "dim");
})();
</script>
</body>
</html>
